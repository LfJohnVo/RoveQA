name: roveqa

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_qa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic} -d ${POSTGRES_DB:-agentic_qa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/auto-setup:1.29.7}
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-agentic}
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 || tctl --address temporal:7233 cluster health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.53.3}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:v4.20.3}
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: runtime
    command: ["uvicorn", "agentic_qa.interfaces.http.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_qa}
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: ./backend
      target: worker
    command: ["python", "-m", "agentic_qa.infrastructure.workflows.temporal.worker"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_qa}
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      # Absent by default: without a model endpoint the worker still runs and reports
      # that no agent runtime is configured, instead of faking decisions.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-2}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
      # A checkpoint may only rebuild the types we listed. Anything else in the
      # checkpoint table is refused instead of imported.
      LANGGRAPH_STRICT_MSGPACK: "true"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    # Deliberately replaceable: no run state lives in this container, so it can be
    # killed and restarted without losing a run.
    restart: unless-stopped

  # Development gates run in containers, not on the host: Linux gives the browser
  # and the checkpointer one event loop that serves both, and the toolchain stops
  # depending on what happens to be installed on a developer's machine.
  # Started on demand (`docker compose run --rm backend-tests`), never by `up`.
  backend-tests:
    build:
      context: ./backend
      target: dev
    profiles: ["gates"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_qa}
      POSTGRES_TEST_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_qa}
      REDIS_TEST_URL: redis://redis:6379/15
      TEMPORAL_ADDRESS: temporal:7233
      # Same regime as the worker, so a type missing from the checkpoint allowlist
      # fails the suite instead of somebody's recovery.
      LANGGRAPH_STRICT_MSGPACK: "true"
    volumes:
      # Source is mounted so a change is tested without a rebuild; the virtualenv
      # lives at /opt/venv precisely so this mount cannot hide it.
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      # The published contracts, read-only: the suite validates its output against the
      # real schema files rather than a copy that could drift away from them.
      - ./contracts:/app/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # Blueprint/contract validation also runs in a container so the gate does not
  # depend on a python interpreter happening to exist on the host.
  blueprint-check:
    image: python:3.13-slim
    profiles: ["gates"]
    working_dir: /repo
    volumes:
      - .:/repo:ro
    command: ["bash", "scripts/validate-blueprint.sh"]

  frontend-tests:
    image: node:24-alpine
    profiles: ["gates"]
    working_dir: /app
    environment:
      CI: "true"
      # Store and node_modules live in volumes, never in the bind mount: a container
      # writing 150MB of package store into the repository is pollution, not output.
      PNPM_HOME: /pnpm
      npm_config_store_dir: /pnpm/store
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm
    command: ["sh", "-c", "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && pnpm build"]

  cli-tests:
    image: node:24-alpine
    profiles: ["gates"]
    working_dir: /app
    environment:
      CI: "true"
      PNPM_HOME: /pnpm
      npm_config_store_dir: /pnpm/store
    volumes:
      - ./cli:/app
      # The CLI validates against the same schema files the backend does, mounted
      # read-only: a copy inside the package would be free to drift from them.
      - ./contracts:/contracts:ro
      - cli_node_modules:/app/node_modules
      - cli_pnpm_store:/pnpm
    command: ["sh", "-c", "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test"]

  # Heavy inference stays behind profiles so CPU-only development works.
  # The model tag is configuration, not a constant: it depends on the GPU on the host
  # actually running this, so it is set in .env rather than pinned here.
  # Verified on an RTX 5060 Ti (16GB, sm_120 Blackwell) with driver 610.62.
  # `--structured-outputs-config` replaced `--guided-decoding-backend` in 0.27; its
  # default backend ('auto') resolves to xgrammar, which is what makes
  # `response_format: json_schema` enforced at the server instead of merely requested.
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1-cu129}
    profiles: ["gpu"]
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}"
      - "--served-model-name"
      - "${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      # Weights take ~8GB of the 16GB card; the rest is KV cache and activations.
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}"
      # Matches MODEL_MAX_CONCURRENCY: admitting more sequences than the client will
      # ever send just reserves KV cache nobody uses.
      - "--max-num-seqs"
      - "${VLLM_MAX_NUM_SEQS:-4}"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      # Docker Desktop runs containers under WSL2, where vLLM disables pinned memory by
      # default. Its GPU worker allocates UVA buffers, which need it, so without this
      # the engine dies at startup with "UVA is not available". Safe here: the switch is
      # gated on a WSL2 kernel >= 4.19.121 and this host runs 6.6.
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    volumes:
      - ./data/models:/root/.cache/huggingface
    # NCCL and the shared-memory allocator need more than Docker's 64MB default.
    shm_size: "8gb"
    # 8100 on the host: 8000 already belongs to the API, and a port clash would only
    # show up when someone enables this profile.
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 40
      # First boot downloads weights and compiles CUDA graphs; later boots are minutes.
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  vllm-embed:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["memory-gpu"]
    environment:
      VLLM_EMBED_MODEL: ${VLLM_EMBED_MODEL:-configure-embedding-model}
    ports:
      - "8001:8000"

  # api / worker / frontend services are added in their phases (02/10)
  # once real entrypoints exist. airllm is added in Phase 11.

volumes:
  postgres_data: {}
  falkordb_data: {}
  frontend_node_modules: {}
  frontend_pnpm_store: {}
  cli_node_modules: {}
  cli_pnpm_store: {}
