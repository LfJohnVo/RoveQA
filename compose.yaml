name: roveqa

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_qa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the suite's own database on first init, so running the tests
      # cannot drop the tables the API is serving from.
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic} -d ${POSTGRES_DB:-agentic_qa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/auto-setup:1.29.7}
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-agentic}
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 || tctl --address temporal:7233 cluster health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.53.3}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:v4.20.3}
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Schema before anything reads it. `docker compose up -d` used to leave every service
  # healthy and the API answering 500 on its first real request: nobody had run Alembic,
  # and `/health` said `ok` because it does not touch a table. The symptom named neither
  # the cause nor the fix, so the five-minute path in the README was a lie by omission.
  #
  # One shot, then gone. `api` and `worker` wait for it to *succeed*, which is what makes
  # a fresh clone correct by construction rather than by remembering `make migrate`.
  migrate:
    build:
      context: ./backend
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_qa}
    volumes:
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    command: ["uvicorn", "agentic_qa.interfaces.http.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_qa}
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      # The learned-memory projection (ADR 0008). Rebuildable from PostgreSQL, so
      # losing it costs retrieval breadth and never a run's correctness.
      FALKORDB_URL: ${FALKORDB_URL:-redis://falkordb:6379}
      GRAPH_DATABASE: ${GRAPH_DATABASE:-roveqa}
      # Graphiti's telemetry is opt-out. A local-first deployment does not phone home
      # about how much memory it is building.
      GRAPHITI_TELEMETRY_ENABLED: "false"
      # Absent by default: without a pooling endpoint the graph still answers by text
      # search, and PostgreSQL's deterministic ranking is unaffected.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    volumes:
      # Evidence bytes. Shared on purpose: the worker captures them and the API serves
      # them, and until this existed they were written into the worker's own container
      # filesystem — unreadable by the API and gone the moment the worker was replaced.
      # The references live in PostgreSQL (docs/11); this is where the bytes live.
      - artifact_data:/data/runs
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: ./backend
      target: worker
    command: ["python", "-m", "agentic_qa.infrastructure.workflows.temporal.worker"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_qa}
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      # Absent by default: without a model endpoint the worker still runs and reports
      # that no agent runtime is configured, instead of faking decisions.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-2}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
      # A checkpoint may only rebuild the types we listed. Anything else in the
      # checkpoint table is refused instead of imported.
      LANGGRAPH_STRICT_MSGPACK: "true"
      # The learned-memory projection (ADR 0008). Rebuildable from PostgreSQL, so
      # losing it costs retrieval breadth and never a run's correctness.
      FALKORDB_URL: ${FALKORDB_URL:-redis://falkordb:6379}
      GRAPH_DATABASE: ${GRAPH_DATABASE:-roveqa}
      # Graphiti's telemetry is opt-out. A local-first deployment does not phone home
      # about how much memory it is building.
      GRAPHITI_TELEMETRY_ENABLED: "false"
      # Absent by default: without a pooling endpoint the graph still answers by text
      # search, and PostgreSQL's deterministic ranking is unaffected.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Cold-path analysis of failure clusters (Phase 11). Absent by default: failures
      # are still grouped deterministically and reported, with no hypothesis attached.
      DEEP_BASE_URL: ${DEEP_BASE_URL:-}
      DEEP_MODEL: ${DEEP_MODEL:-}
      DEEP_TIMEOUT_SECONDS: ${DEEP_TIMEOUT_SECONDS:-900}
      DEEP_MAX_OUTPUT_TOKENS: ${DEEP_MAX_OUTPUT_TOKENS:-800}
    volumes:
      # Evidence bytes. Shared on purpose: the worker captures them and the API serves
      # them, and until this existed they were written into the worker's own container
      # filesystem — unreadable by the API and gone the moment the worker was replaced.
      # The references live in PostgreSQL (docs/11); this is where the bytes live.
      - artifact_data:/data/runs
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    # Deliberately replaceable: no run state lives in this container, so it can be
    # killed and restarted without losing a run — and now no evidence does either.
    restart: unless-stopped

  # Development gates run in containers, not on the host: Linux gives the browser
  # and the checkpointer one event loop that serves both, and the toolchain stops
  # depending on what happens to be installed on a developer's machine.
  # Started on demand (`docker compose run --rm backend-tests`), never by `up`.
  backend-tests:
    build:
      context: ./backend
      target: dev
    profiles: ["gates"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_qa}
      # A database of its own: the suite creates and drops tables, and pointing it
      # at the application's database destroys whatever a developer was looking at.
      POSTGRES_TEST_DSN: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_TEST_DB:-agentic_qa_test}
      REDIS_TEST_URL: redis://redis:6379/15
      TEMPORAL_ADDRESS: temporal:7233
      # Same regime as the worker, so a type missing from the checkpoint allowlist
      # fails the suite instead of somebody's recovery.
      LANGGRAPH_STRICT_MSGPACK: "true"
      # A real FalkorDB, in its own graph: the projection tests wipe it, and doing that
      # to the application's graph would delete whatever a developer was looking at.
      FALKORDB_TEST_URL: redis://falkordb:6379
      GRAPH_DATABASE: roveqa_test
      GRAPHITI_TELEMETRY_ENABLED: "false"
    volumes:
      # Source is mounted so a change is tested without a rebuild; the virtualenv
      # lives at /opt/venv precisely so this mount cannot hide it.
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      # Maintenance scripts the gate runs (resetting the suite's own database).
      - ./backend/scripts:/app/scripts
      # The published contracts, read-only: the suite validates its output against the
      # real schema files rather than a copy that could drift away from them.
      - ./contracts:/app/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      falkordb:
        condition: service_healthy

  # Blueprint/contract validation also runs in a container so the gate does not
  # depend on a python interpreter happening to exist on the host.
  blueprint-check:
    image: python:3.13-slim
    profiles: ["gates"]
    working_dir: /repo
    volumes:
      - .:/repo:ro
    command: ["bash", "scripts/validate-blueprint.sh"]

  # The control UI (Phase 10). Vite's dev server rather than a built bundle: this is
  # the development topology, and a production image is a Phase 14 concern.
  #
  # It proxies /api to the API container, so the browser talks to one origin and no
  # CORS configuration has to exist for development only — a setting that exists only
  # in development is a setting nobody tests.
  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      ROVEQA_API_URL: http://api:8000
      # A bind mount from a Windows or macOS host delivers no file events into the
      # container; without polling the dev server never reloads and every edit needs a
      # container restart. Set it to false on a Linux host to save the CPU.
      VITE_POLL_WATCH: ${VITE_POLL_WATCH:-true}
      PNPM_HOME: /pnpm
      npm_config_store_dir: /pnpm/store
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm
    command:
      - "sh"
      - "-c"
      - "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend-tests:
    image: node:24-alpine
    profiles: ["gates"]
    working_dir: /app
    environment:
      CI: "true"
      # Store and node_modules live in volumes, never in the bind mount: a container
      # writing 150MB of package store into the repository is pollution, not output.
      PNPM_HOME: /pnpm
      npm_config_store_dir: /pnpm/store
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm
    command: ["sh", "-c", "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && pnpm build"]

  cli-tests:
    image: node:24-alpine
    profiles: ["gates"]
    working_dir: /app
    environment:
      CI: "true"
      PNPM_HOME: /pnpm
      npm_config_store_dir: /pnpm/store
    volumes:
      - ./cli:/app
      # The CLI validates against the same schema files the backend does, mounted
      # read-only: a copy inside the package would be free to drift from them.
      - ./contracts:/contracts:ro
      - cli_node_modules:/app/node_modules
      - cli_pnpm_store:/pnpm
    command: ["sh", "-c", "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test"]

  # The bundled target application, served so the *worker* can reach it. The browser
  # tests run it in-process, which is right for them and useless for a baseline: a run
  # happens in a container, and `127.0.0.1` there is not this.
  #
  # Behind a profile because nothing in normal operation needs it, and it deliberately
  # serves a page whose `load` event never fires — `/real-web`, the hazards a public page
  # carries. A fixture that answers instantly and completely is the environment in which
  # two shipped defects were invisible.
  target-app:
    build:
      context: ./backend
      target: dev
    profiles: ["baseline"]
    command:
      - "uvicorn"
      - "--factory"
      - "tests.target_app.app:create_target_app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    volumes:
      - ./backend/tests:/app/tests
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 5s
      timeout: 3s
      retries: 12

  # Heavy inference stays behind profiles so CPU-only development works.
  # The model tag is configuration, not a constant: it depends on the GPU on the host
  # actually running this, so it is set in .env rather than pinned here.
  # Verified on an RTX 5060 Ti (16GB, sm_120 Blackwell) with driver 610.62.
  # `--structured-outputs-config` replaced `--guided-decoding-backend` in 0.27; its
  # default backend ('auto') resolves to xgrammar, which is what makes
  # `response_format: json_schema` enforced at the server instead of merely requested.
  # Which model this serves is configuration, not a constant: it depends on the GPU of
  # the host running it. Everything that decides whether a model *fits* is a variable
  # too — quantization and eager mode are what let a larger Qwen onto a 16GB card — and
  # VLLM_EXTRA_ARGS is the escape hatch for anything else rather than a variable per
  # flag. See .env.example for the menu and what fits.
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1-cu129}
    profiles: ["gpu"]
    # Shell form on purpose: an unset optional flag has to disappear entirely. Passing
    # `--quantization ""` is not the same as not passing it, and vLLM rejects it.
    entrypoint: ["sh", "-lc"]
    command:
      - >
        exec vllm serve "$$VLLM_MODEL"
        --served-model-name "$$VLLM_MODEL"
        --max-model-len "$$VLLM_MAX_MODEL_LEN"
        --gpu-memory-utilization "$$VLLM_GPU_MEMORY_UTILIZATION"
        --max-num-seqs "$$VLLM_MAX_NUM_SEQS"
        $${VLLM_QUANTIZATION:+--quantization "$$VLLM_QUANTIZATION"}
        $${VLLM_ENFORCE_EAGER:+--enforce-eager}
        $$VLLM_EXTRA_ARGS
    environment:
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-16384}
      # Weights plus KV cache plus activations. Raise it for a bigger model only after
      # the weights actually fit: overcommitting fails at load, not at request time.
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      # Matches MODEL_MAX_CONCURRENCY: admitting more sequences than the client will
      # ever send just reserves KV cache nobody uses.
      VLLM_MAX_NUM_SEQS: ${VLLM_MAX_NUM_SEQS:-4}
      # Empty means "not quantized". AWQ/GPTQ is what puts a 14B-class model on 16GB.
      VLLM_QUANTIZATION: ${VLLM_QUANTIZATION:-}
      # Set to any non-empty value to skip CUDA graph capture. Costs some latency and
      # saves the memory the capture needs — often the difference between a large model
      # loading and OOMing at startup.
      VLLM_ENFORCE_EAGER: ${VLLM_ENFORCE_EAGER:-}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      # Docker Desktop runs containers under WSL2, where vLLM disables pinned memory by
      # default. Its GPU worker allocates UVA buffers, which need it, so without this
      # the engine dies at startup with "UVA is not available". Safe here: the switch is
      # gated on a WSL2 kernel >= 4.19.121 and this host runs 6.6.
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    volumes:
      - ./data/models:/root/.cache/huggingface
    # NCCL and the shared-memory allocator need more than Docker's 64MB default.
    shm_size: "8gb"
    # 8100 on the host: 8000 already belongs to the API, and a port clash would only
    # show up when someone enables this profile.
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 40
      # First boot downloads weights and compiles CUDA graphs; later boots are minutes.
      # A larger model downloads more, so raise it rather than reading a slow first
      # boot as a failure.
      start_period: ${VLLM_START_PERIOD:-600s}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  # Embeddings for the learned-memory graph (ADR 0008). A separate server from the
  # generation one on purpose: a pooling model and a chat model are different models,
  # and sharing one endpoint would make every embedding queue behind the planner.
  #
  # Its own profile because on a single-GPU host it competes with `vllm` for the card.
  # Enable it when semantic retrieval is worth the memory; without it the graph still
  # answers by text and PostgreSQL's deterministic ranking is unaffected.
  vllm-embed:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1-cu129}
    profiles: ["memory-gpu"]
    entrypoint: ["sh", "-lc"]
    command:
      - >
        exec vllm serve "$$EMBEDDING_MODEL"
        --served-model-name "$$EMBEDDING_MODEL"
        --runner pooling
        --max-model-len "$$EMBEDDING_MAX_MODEL_LEN"
        --gpu-memory-utilization "$$EMBEDDING_GPU_MEMORY_UTILIZATION"
        $$EMBEDDING_EXTRA_ARGS
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_MAX_MODEL_LEN: ${EMBEDDING_MAX_MODEL_LEN:-8192}
      # Small by default: this shares the card with the generation server, and an
      # embedder that starves the planner costs more than the recall it adds.
      EMBEDDING_GPU_MEMORY_UTILIZATION: ${EMBEDDING_GPU_MEMORY_UTILIZATION:-0.10}
      EMBEDDING_EXTRA_ARGS: ${EMBEDDING_EXTRA_ARGS:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    volumes:
      - ./data/models:/root/.cache/huggingface
    shm_size: "2gb"
    ports:
      - "8101:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: ${VLLM_START_PERIOD:-600s}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  # Deep analysis (Phase 11). A second OpenAI-compatible server, deliberately not the
  # same one the browser loop talks to: a model big enough to explain a cluster answers
  # in minutes, and putting it behind the planner's endpoint would make every browser
  # step queue behind an analysis.
  #
  # Its own profile because on a single-GPU host it competes with `vllm` for the card.
  # The intended use is sequential — run the fast model while runs execute, bring this
  # up to analyse — or a second machine. Nothing breaks when it is simply never started:
  # triage still groups failures and the clusters still land.
  #
  # AirLLM is the alternative for a model far larger than the card, streamed layer by
  # layer at minutes per answer; anything speaking /v1/chat/completions works here, and
  # DEEP_BASE_URL is all the backend knows about it.
  vllm-deep:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1-cu129}
    profiles: ["deep-gpu"]
    entrypoint: ["sh", "-lc"]
    command:
      - >
        exec vllm serve "$$DEEP_MODEL"
        --served-model-name "$$DEEP_MODEL"
        --max-model-len "$$DEEP_MAX_MODEL_LEN"
        --gpu-memory-utilization "$$DEEP_GPU_MEMORY_UTILIZATION"
        --max-num-seqs 1
        $${DEEP_QUANTIZATION:+--quantization "$$DEEP_QUANTIZATION"}
        $${DEEP_ENFORCE_EAGER:+--enforce-eager}
        $$DEEP_EXTRA_ARGS
    environment:
      # Bigger than the planner's model on purpose — that is the entire reason this
      # endpoint exists. Quantized so a 14B-class model fits on 16GB.
      DEEP_MODEL: ${DEEP_MODEL:-Qwen/Qwen3-14B-AWQ}
      DEEP_MAX_MODEL_LEN: ${DEEP_MAX_MODEL_LEN:-16384}
      DEEP_GPU_MEMORY_UTILIZATION: ${DEEP_GPU_MEMORY_UTILIZATION:-0.90}
      DEEP_QUANTIZATION: ${DEEP_QUANTIZATION:-awq_marlin}
      DEEP_ENFORCE_EAGER: ${DEEP_ENFORCE_EAGER:-1}
      DEEP_EXTRA_ARGS: ${DEEP_EXTRA_ARGS:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    volumes:
      - ./data/models:/root/.cache/huggingface
    shm_size: "8gb"
    ports:
      - "8102:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: ${VLLM_START_PERIOD:-600s}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  # api / worker / frontend services are added in their phases (02/10)
  # once real entrypoints exist.

volumes:
  postgres_data: {}
  artifact_data: {}
  falkordb_data: {}
  frontend_node_modules: {}
  frontend_pnpm_store: {}
  cli_node_modules: {}
  cli_pnpm_store: {}
