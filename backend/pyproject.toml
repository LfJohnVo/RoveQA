[project]
name = "agentic-qa"
version = "0.1.0"
description = "RoveQA control plane and agent runtime (FastAPI backend)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "temporalio>=1.31.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_qa"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Generated migrations are historical artifacts: never restyled, never edited once
# applied. alembic/env.py is ours and stays linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A warning is a defect signal (ORM identity conflicts, deprecations); never noise.
filterwarnings = ["error"]
