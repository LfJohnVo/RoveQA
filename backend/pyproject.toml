[project]
name = "agentic-qa"
version = "0.1.0"
description = "RoveQA control plane and agent runtime (FastAPI backend)"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_qa"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["agentic_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
